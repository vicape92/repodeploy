services:
  app:
    build: .
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      FAIL_START: "0"
      FAIL_HEALTH: "0"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 1s
      timeout: 1s
      retries: 2
    stop_grace_period: 2s
volumes:
  data: {}
